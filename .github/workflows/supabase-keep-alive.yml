name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * 1'   # jeden Montag, 08:00 UTC
  workflow_dispatch:        # manuell auslösbar zum Testen

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            --max-time 30)
          echo "HTTP Status: $STATUS"
          [ "$STATUS" -ne 000 ] || exit 1
